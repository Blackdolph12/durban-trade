<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Moise Disasi 💚 Private</title>
<script src="https://unpkg.com/peerjs@1.5.3/dist/peerjs.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#111b21;height:100dvh;display:flex;flex-direction:column}
.wa-header{background:#202c33;padding:10px 12px;display:flex;align-items:center;color:white;gap:10px}
.avatar{width:40px;height:40px;border-radius:50%;background:#00a884;display:flex;align-items:center;justify-content:center;font-weight:bold}
.call-btn{font-size:22px;padding:6px 10px;cursor:pointer}
.wa-bg{flex:1;background:#0b141a url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');background-size:280px;display:flex;flex-direction:column}
#setup{margin:auto;background:#202c33;color:white;padding:22px;border-radius:12px;width:90%;max-width:340px;text-align:center}
.btn{width:100%;padding:13px;border:none;border-radius:25px;font-weight:700;margin-top:10px}
.btn-host{background:#00a884;color:white}
.btn-join{background:#2a3942;color:#00a884;border:1px solid #333}
#chatWrap{display:none;flex:1;flex-direction:column;overflow:hidden}
#msgs{flex:1;overflow-y:auto;padding:12px 8px;display:flex;flex-direction:column;gap:3px}
.bubble{max-width:75%;padding:7px 9px 4px;border-radius:7.5px;font-size:14.5px;box-shadow:0 1px .5px rgba(0,0,0,.2)}
.me{align-self:flex-end;background:#005c4b;color:#e9edef;border-top-right-radius:0}
.you{align-self:flex-start;background:#202c33;color:#e9edef;border-top-left-radius:0}
.meta{font-size:11px;color:#8696a0;text-align:right;margin-top:3px}
.input-bar{background:#202c33;padding:6px 8px;display:flex;gap:8px}
.input-bar input{flex:1;background:#2a3942;border:none;border-radius:20px;padding:11px 14px;color:white;outline:none}
.icon-btn{width:42px;height:42px;border-radius:50%;background:#00a884;border:none;color:white;font-size:20px}
#callScreen{display:none;position:fixed;inset:0;background:#0b141a;z-index:99;flex-direction:column;align-items:center;justify-content:center;color:white}
#remoteVideo{width:100%;height:100%;object-fit:cover}
#localVideo{position:absolute;width:100px;height:140px;bottom:90px;right:15px;border-radius:12px;border:2px solid #00a884;background:black}
</style>
</head>
<body>
<div class="wa-header">
<div class="avatar">M</div>
<div><div style="font-weight:600">Moise Disasi ❤️</div><div style="font-size:12px;color:#8696a0" id="online">tap HOST/JOIN to connect</div></div>
<div style="margin-left:auto;display:flex">
<div class="call-btn" onclick="makeCall(false)">📞</div>
<div class="call-btn" onclick="makeCall(true)">🎥</div>
</div>
</div>

<div class="wa-bg">
<div id="setup">
<h3>Private Encrypted Chat</h3>
<p style="font-size:12px;color:#8696a0;margin:8px 0">Voice + Video • P2P • No card</p>
<p style="margin:10px 0">Room: <b style="background:#111b21;padding:5px 8px;border-radius:6px">moise-disasi-private</b></p>
<button class="btn btn-host" onclick="host()">HOST - Moise Disasi</button>
<button class="btn btn-join" onclick="join()">JOIN - Connect</button>
<p id="info" style="font-size:11px;color:#00a884;margin-top:8px"></p>
</div>
<div id="chatWrap">
<div id="msgs"></div>
<div class="input-bar">
<input id="t" placeholder="Message" onkeypress="if(event.key==='Enter')sendM()">
<button class="icon-btn" onclick="sendM()">➤</button>
</div>
</div>
</div>

<div id="callScreen">
<video id="remoteVideo" autoplay playsinline></video>
<video id="localVideo" autoplay muted playsinline></video>
<div style="position:absolute;top:20px">Moise Disasi</div>
<div style="position:absolute;bottom:20px;display:flex;gap:20px">
<button onclick="endCall()" style="background:#f15c6d;border:none;width:60px;height:60px;border-radius:50%;font-size:24px">📵</button>
</div>
</div>

<script>
const ROOM="moise-disasi-private-v4";
let peer,conn,localStream,currentCall;
function add(txt,cls){let d=document.createElement('div');d.className='bubble '+cls;d.innerHTML=txt+`<div class=meta>${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} ✓✓</div>`;document.getElementById('msgs').appendChild(d);document.getElementById('msgs').scrollTop=9999;}
function showChat(){document.getElementById('setup').style.display='none';document.getElementById('chatWrap').style.display='flex';document.getElementById('online').innerText='online • Moise Disasi';}
function host(){
 document.getElementById('info').innerText='Hosting as Moise... tell partner to JOIN';
 peer=new Peer(ROOM);
 peer.on('connection',c=>{conn=c;showChat();c.on('data',d=>add(d,'you'));});
 peer.on('call',async call=>{
   let stream=await navigator.mediaDevices.getUserMedia({video:call.metadata.video,audio:true});
   call.answer(stream); handleCall(call,stream);
 });
}
function join(){
 document.getElementById('info').innerText='Connecting to Moise...';
 peer=new Peer();
 peer.on('open',()=>{
  conn=peer.connect(ROOM);
  conn.on('open',showChat); conn.on('data',d=>add(d,'you'));
 });
 peer.on('call',async call=>{
   let stream=await navigator.mediaDevices.getUserMedia({video:call.metadata.video,audio:true});
   call.answer(stream); handleCall(call,stream);
 });
}
function sendM(){let i=document.getElementById('t');if(!i.value||!conn)return;add(i.value,'me');conn.send(i.value);i.value='';}
async function makeCall(isVideo){
 if(!peer) return alert('First tap HOST or JOIN');
 try{
  localStream=await navigator.mediaDevices.getUserMedia({video:isVideo,audio:true});
  let call=peer.call(ROOM,localStream,{metadata:{video:isVideo}});
  handleCall(call,localStream);
 }catch(e){alert('Allow camera/mic: '+e.message)}
}
function handleCall(call,stream){
 currentCall=call; document.getElementById('callScreen').style.display='flex';
 document.getElementById('localVideo').srcObject=stream;
 call.on('stream',remote=>{document.getElementById('remoteVideo').srcObject=remote;});
 call.on('close',endCall);
}
function endCall(){
 document.getElementById('callScreen').style.display='none';
 if(currentCall) currentCall.close();
 if(localStream) localStream.getTracks().forEach(t=>t.stop());
}
</script>
</body>
</html>

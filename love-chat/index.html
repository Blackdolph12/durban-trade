<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fati 💖 Love Chat</title>
<script src="https://unpkg.com/peerjs@1.5.3/dist/peerjs.min.js"></script>
<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white;text-align:center}
.header{background:#1e293b;padding:15px}
.header h1{margin:0;color:#fb7185}
.card{background:white;color:#0f172a;margin:15px;border-radius:20px;padding:20px;max-width:420px;margin-left:auto;margin-right:auto}
#msgs{height:320px;overflow-y:auto;background:#f8fafc;border-radius:15px;padding:10px;text-align:left}
.m{padding:10px 14px;border-radius:18px;margin:6px 0;max-width:75%;word-wrap:break-word;display:inline-block;clear:both}
.me{background:#22c55e;color:white;float:right}
.you{background:#e2e8f0;float:left}
input{width:75%;padding:12px;border-radius:20px;border:1px solid #ddd}
#sendBtn{width:20%;padding:12px;border-radius:20px;border:none;background:#fb7185;color:white;font-weight:bold}
.status{font-size:13px;color:#22c55e;margin:5px}
</style>
</head>
<body>
<div class="header"><h1>Blessing ❤️ Fati</h1><small>Private • No Card • P2P</small></div>

<div class="card" id="setup">
<h3>Your Private Room</h3>
<p>ID: <b style="background:#ffe4e6;padding:5px 10px;border-radius:10px">fati-blessing-1000</b></p>
<p style="font-size:13px;color:#666">Both open same link. One clicks HOST, other clicks JOIN.</p>
<button onclick="host()" style="width:90%;padding:14px;background:#22c55e;color:white;border:none;border-radius:12px;font-weight:bold;margin:5px">I AM HOST (Blessing)</button>
<button onclick="join()" style="width:90%;padding:14px;background:#fb7185;color:white;border:none;border-radius:12px;font-weight:bold;margin:5px">I AM JOINING (Fati)</button>
<p id="info" style="font-size:12px;color:green"></p>
</div>

<div class="card" id="chat" style="display:none">
<div class="status" id="stat">● Connected</div>
<div id="msgs"></div>
<div style="display:flex;gap:5px;margin-top:10px">
<input id="t" placeholder="Type love message...">
<button id="sendBtn" onclick="sendM()">Send</button>
</div>
</div>

<script>
const ROOM = "fati-blessing-1000-love-v2";
let peer, conn;
function add(txt, cls){
  let d=document.createElement('div');d.style.clear='both';
  let m=document.createElement('div');m.className='m '+cls;m.innerText=txt;
  d.appendChild(m);document.getElementById('msgs').appendChild(d);
  document.getElementById('msgs').scrollTop=99999;
}
function host(){
  peer=new Peer(ROOM);
  document.getElementById('info').innerText="Hosting... Tell Fati to click JOIN now";
  peer.on('connection', c=>{
    conn=c; showChat();
    c.on('data', d=>add(d,'you'));
  });
}
function join(){
  peer=new Peer();
  peer.on('open', ()=>{
    conn=peer.connect(ROOM);
    conn.on('open', showChat);
    conn.on('data', d=>add(d,'you'));
  });
}
function showChat(){
  document.getElementById('setup').style.display='none';
  document.getElementById('chat').style.display='block';
  add('Connected! Start chatting 💕','you');
}
function sendM(){
  let i=document.getElementById('t'); if(!i.value||!conn) return;
  add(i.value,'me'); conn.send(i.value); i.value='';
}
</script>
</body>
</html>

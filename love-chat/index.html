<h3>Moise Disasi ❤️</h3><button class="btn host" onclick="host()">HOST - Moise</button><button class="btn join" onclick="join()">JOIN</button><p id="info" style="font-size:11px;color:#00a884;margin-top:10px"></p></div></div></div>
<div id="callScreen"><video id="remoteVideo" autoplay playsinline></video><video id="localVideo" autoplay muted playsinline></video><div style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%)"><button onclick="endCall()" style="background:#f15c6d;border:none;width:60px;height:60px;border-radius:50%;font-size:24px">📵</button></div></div>
<script>
const ROOM="moise-private-final";let peer,conn,localStream,currentCall;
function add(t,c){let d=document.createElement('div');d.className='b '+c;d.innerText=t;document.getElementById('msgs').appendChild(d);document.getElementById('msgs').scrollTop=99999;}
function show(){document.getElementById('setup').style.display='none';}
function host(){document.getElementById('info').innerText='Starting...';peer=new Peer(ROOM);peer.on('open',()=>{document.getElementById('info').innerText='✅ LIVE! She taps JOIN now';});peer.on('connection',c=>{conn=c;show();c.on('data',d=>{add(d,'you');});});peer.on('call',async call=>{let s=await navigator.mediaDevices.getUserMedia({video:call.metadata.video,audio:true});localStream=s;call.answer(s);handleCall(call,s);});}
function join(){document.getElementById('info').innerText='Connecting...';peer=new Peer();peer.on('open',()=>{let c=peer.connect(ROOM);c.on('open',()=>{conn=c;show();});c.on('data',d=>{add(d,'you');});});peer.on('call',async call=>{let s=await navigator.mediaDevices.getUserMedia({video:call.metadata.video,audio:true});localStream=s;call.answer(s);handleCall(call,s);});}
function sendM(){let i=document.getElementById('t');if(!i.value||!conn)return;add(i.value,'me');conn.send(i.value);i.value='';}
async function makeCall(video){if(!conn)return alert('Connect first HOST/JOIN');try{localStream=await navigator.mediaDevices.getUserMedia({video:video,audio:true});let call=peer.call(ROOM,localStream,{metadata:{video:video}});handleCall(call,localStream);}catch(e){alert(e.message)}}
function handleCall(call,stream){currentCall=call;document.getElementById('callScreen').style.display='block';document.getElementById('localVideo').srcObject=stream;call.on('stream',r=>{document.getElementById('remoteVideo').srcObject=r;});call.on('close',endCall);}
function endCall(){document.getElementById('callScreen').style.display='none';if(currentCall)currentCall.close();if(localStream)localStream.getTracks().forEach(t=>t.stop());}
</script></body></html>

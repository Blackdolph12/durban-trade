<h3>Moise Disasi ❤️</h3><p style="font-size:12px;color:#8696a0;margin:8px 0">Private WhatsApp</p>
<button class="btn host" onclick="host()">HOST - Moise</button><button class="btn join" onclick="join()">JOIN</button><p id="info" style="font-size:11px;color:#00a884;margin-top:10px"></p></div></div>
</div>
<script>
const ROOM="moise-private-v6";let peer,conn;
function add(t,c){let d=document.createElement('div');d.className='b '+c;d.innerText=t;document.getElementById('msgs').appendChild(d);document.getElementById('msgs').scrollTop=9999;}
function show(){document.getElementById('setup').style.display='none';}
function host(){document.getElementById('info').innerText='Starting...';peer=new Peer(ROOM);peer.on('open',()=>{document.getElementById('info').innerText='✅ LIVE! Open on other phone & JOIN';});peer.on('connection',c=>{conn=c;show();c.on('data',d=>add(d,'you'));});}
function join(){document.getElementById('info').innerText='Connecting...';peer=new Peer();peer.on('open',()=>{let c=peer.connect(ROOM);c.on('open',()=>{conn=c;show();});c.on('data',d=>add(d,'you'));});}
function sendM(){let i=document.getElementById('t');if(!i.value||!conn)return;add(i.value,'me');conn.send(i.value);i.value='';}
</script></body></html>

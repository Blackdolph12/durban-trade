<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Durban Trade - Live</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-black text-white">
<div class="flex justify-between p-3 bg-zinc-900 items-center"><h1 class="font-black">DURBAN TRADE</h1><div class="flex gap-2 items-center"><span id="bal" class="bg-yellow-500 text-black px-3 py-1 rounded-full font-black">R650.00</span><span class="bg-green-500 text-black text-[10px] px-2 py-1 rounded-full font-bold">LIVE</span></div></div>
<div class="p-3"><div class="flex justify-between text-xs text-gray-400"><span>EUR/USD • OTC</span><span class="text-green-400 font-bold">PAYOUT 87%</span></div>
<div class="bg-zinc-900 rounded-xl mt-2 p-1"><canvas id="chart" width="350" height="260" style="width:100%;height:260px;display:block"></canvas></div>
<div id="price" class="text-center font-black text-xl mt-2 text-yellow-400">1.07524</div></div>
<div class="p-3"><div class="bg-zinc-900 rounded-xl p-3"><label class="text-xs text-gray-400">Trade Amount</label><input id="tAmt" value="50" class="w-full bg-black border border-zinc-700 p-3 rounded-xl font-black mt-1"></div>
<div class="grid grid-cols-2 gap-3 mt-3"><button onclick="trade('BUY')" class="bg-green-500 text-black p-5 rounded-xl font-black text-lg">↑ BUY</button><button onclick="trade('SELL')" class="bg-red-500 text-black p-5 rounded-xl font-black text-lg">↓ SELL</button></div>
<div id="result" class="hidden mt-3 p-3 rounded-xl text-center font-black bg-red-500">LOSS -R50</div>
<div class="grid grid-cols-2 gap-2 mt-3"><button onclick="balance+=500;updateBal()" class="bg-yellow-500 text-black p-3 rounded-xl font-black">+R500 Deposit</button><button onclick="window.open('https://wa.me/27817070456','_blank')" class="bg-zinc-800 p-3 rounded-xl">WhatsApp</button></div>
</div>
<script>
let balance=parseFloat(localStorage.getItem('dt_bal')||'650');function updateBal(){document.getElementById('bal').innerText='R'+balance.toFixed(2);localStorage.setItem('dt_bal',balance)}updateBal();
let price=1.07524;let points=[];for(let i=0;i<50;i++)points.push(1.075+ (Math.random()-0.5)*0.01);
const c=document.getElementById('chart');const ctx=c.getContext('2d');
function draw(){ctx.fillStyle='#18181b';ctx.fillRect(0,0,c.width,c.height);ctx.beginPath();ctx.strokeStyle='#eab308';ctx.lineWidth=2.5;ctx.shadowColor='#eab308';ctx.shadowBlur=8;let min=Math.min(...points),max=Math.max(...points),range=(max-min)||0.001;points.forEach((p,i)=>{let x=(i/49)*c.width;let y=c.height- ((p-min)/range)*(c.height-20)-10;if(i==0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.shadowBlur=0;}
setInterval(()=>{price+=(Math.random()-0.5)*0.0008;points.push(price);points.shift();document.getElementById('price').innerText=price.toFixed(5);draw();},60);
function trade(type){let stake=parseFloat(document.getElementById('tAmt').value);if(stake>balance)return alert('Low balance - add deposit');let res=document.getElementById('result');res.classList.remove('hidden');res.className='mt-3 p-3 rounded-xl text-center font-black bg-yellow-500 text-black';res.innerText=type+' R'+stake+' - waiting 5s...';setTimeout(()=>{let win=Math.random()>0.45;if(win){let prof=stake*0.87;balance+=prof;res.className='mt-3 p-3 rounded-xl text-center font-black bg-green-500 text-black';res.innerText='✅ WIN +R'+prof.toFixed(2)}else{balance-=stake;res.className='mt-3 p-3 rounded-xl text-center font-black bg-red-500 text-white';res.innerText='❌ LOSS -R'+stake}updateBal()},5000)}
draw();
</script></body></html>

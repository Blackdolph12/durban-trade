<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Durban Trade Pro V4</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:system-ui;background:#050505}.page{display:none}.page.active{display:block}.filter-active{background:white!important;color:black!important}</style></head><body class="text-white min-h-screen pb-20">
<div class="flex justify-between items-center p-3 bg-zinc-900 sticky top-0 z-50 border-b border-zinc-800"><h1 class="font-black">DURBAN TRADE <span class="text-yellow-500">PRO</span></h1><div class="flex gap-2 items-center"><span id="bal" class="bg-yellow-500 text-black px-3 py-1 rounded-full font-black text-sm">R5298.00</span><div class="w-7 h-7 bg-zinc-700 rounded-full grid place-items-center">B</div></div></div>

<div id="p-markets" class="page active p-3"><div class="flex justify-between items-center mb-3"><h2 class="font-black text-xl">Markets</h2><span class="text-green-400 text-xs bg-green-900/30 px-2 py-1 rounded">LIVE • 87%</span></div>
<!-- FIXED FILTER BUTTONS -->
<div class="flex gap-2 mb-3 overflow-x-auto"><button onclick="filterAssets('all')" id="f-all" class="filter-active bg-zinc-800 px-4 py-2 rounded-full text-sm font-bold">All</button><button onclick="filterAssets('crypto')" id="f-crypto" class="bg-zinc-800 px-4 py-2 rounded-full text-sm font-bold">Crypto</button><button onclick="filterAssets('forex')" id="f-forex" class="bg-zinc-800 px-4 py-2 rounded-full text-sm font-bold">Forex</button><button onclick="filterAssets('otc')" id="f-otc" class="bg-zinc-800 px-4 py-2 rounded-full text-sm font-bold">OTC</button></div>
<div id="assets" class="space-y-2"></div></div>

<div id="p-trade" class="page"><div class="p-3 flex justify-between text-xs text-gray-400"><span id="tName">BTC/USD • OTC</span><span class="text-green-400 font-bold">PAYOUT 87%</span></div><div class="mx-3 bg-zinc-900 rounded-xl p-1"><canvas id="chart" width="350" height="300" style="width:100%;height:300px;display:block"></canvas></div><div id="price" class="text-center font-black text-2xl mt-2 text-yellow-400">0.00</div><div class="p-3"><div class="bg-zinc-900 rounded-xl p-3"><label class="text-xs text-gray-400">Trade Amount</label><input id="tAmt" value="50" type="number" class="w-full bg-black border border-zinc-700 p-3 rounded-xl font-black mt-1 text-lg"></div><div class="grid grid-cols-2 gap-3 mt-3"><button onclick="trade('BUY')" class="bg-green-500 text-black p-5 rounded-xl font-black">↑ BUY</button><button onclick="trade('SELL')" class="bg-red-500 text-black p-5 rounded-xl font-black">↓ SELL</button></div><div id="result" class="hidden mt-3 p-3 rounded-xl text-center font-black"></div></div></div>

<div id="p-portfolio" class="page p-3"><h2 class="font-black text-xl">Portfolio</h2><div class="bg-gradient-to-br from-yellow-500 to-amber-600 rounded-[20px] p-5 mt-3 text-black"><p class="text-sm">Total Balance</p><p id="bal2" class="text-4xl font-black">R5298.00</p></div><button onclick="showPage('deposit')" class="w-full bg-white text-black p-4 rounded-xl font-black mt-4">Deposit Now</button></div>
<div id="p-deposit" class="page p-3"><h2 class="font-black text-xl">Deposit</h2><div class="bg-white text-black rounded-[20px] p-5 mt-3"><input id="amt" value="1000" class="w-full border-2 border-black p-3 rounded-xl text-xl font-black"><div class="grid grid-cols-4 gap-2 mt-2"><button onclick="amt.value=250" class="bg-gray-100 p-2 rounded-xl font-bold">R250</button><button onclick="amt.value=1000" class="bg-gray-100 p-2 rounded-xl font-bold">R1k</button><button onclick="amt.value=5000" class="bg-gray-100 p-2 rounded-xl font-bold">R5k</button><button onclick="amt.value=10000" class="bg-gray-100 p-2 rounded-xl font-bold">R10k</button></div><button onclick="doDeposit()" class="w-full bg-black text-white p-4 rounded-xl font-black mt-4">ADD R TO BALANCE →</button><button onclick="window.open('https://wa.me/27817070456?text=Deposit Proof','_blank')" class="w-full bg-[#25D366] text-black p-3 rounded-xl font-black mt-2">WhatsApp 0817070456</button></div></div>
<div id="p-withdraw" class="page p-3"><h2 class="font-black text-xl">Withdraw</h2><div class="bg-zinc-900 rounded-xl p-5 mt-3"><p id="bal3" class="text-2xl font-black">R5298.00</p><button class="w-full bg-yellow-500 text-black p-4 rounded-xl font-black mt-4">REQUEST WITHDRAWAL</button></div></div>
<div id="p-history" class="page p-3"><h2 class="font-black text-xl">History</h2><div id="hist" class="space-y-2 mt-3"></div></div>
<div id="p-account" class="page p-3"><h2 class="font-black text-xl">Account</h2><div class="bg-zinc-900 rounded-xl p-4 mt-3"><p class="font-bold">Blessing</p><p class="text-sm text-gray-400">Fatimajayat101324@gmail.com</p></div></div>

<div class="fixed bottom-0 left-0 right-0 bg-zinc-900 border-t border-zinc-800 flex justify-around p-2 text-[11px]"><button onclick="showPage('markets')" class="text-center">📊<br>Markets</button><button onclick="showPage('trade')" class="text-center">📈<br>Trade</button><button onclick="showPage('portfolio')" class="text-center">💼<br>Wallet</button><button onclick="showPage('deposit')" class="text-center">💰<br>Deposit</button><button onclick="showPage('history')" class="text-center">🕘<br>History</button><button onclick="showPage('account')" class="text-center">👤<br>Account</button></div>

<script>
let balance=parseFloat(localStorage.getItem('dt_bal')||'5298');let profit=598;let curFilter='all';let curAsset={name:'BTC/USD',price:67432};let assets=[{name:'BTC/USD',price:67432,change:'+2.4%',type:'crypto',otc:true},{name:'ETH/USD',price:3450,change:'+1.2%',type:'crypto',otc:true},{name:'SOL/USD',price:178.5,change:'+5.1%',type:'crypto',otc:true},{name:'BNB/USD',price:602,change:'+0.9%',type:'crypto',otc:false},{name:'DOGE/USD',price:0.148,change:'+8.2%',type:'crypto',otc:true},{name:'XRP/USD',price:0.52,change:'+1.5%',type:'crypto',otc:true},{name:'EUR/USD',price:1.07524,change:'-0.3%',type:'forex',otc:false},{name:'GBP/USD',price:1.264,change:'+0.1%',type:'forex',otc:false},{name:'USD/ZAR',price:18.72,change:'+0.4%',type:'forex',otc:true},{name:'EUR/ZAR',price:20.14,change:'-0.2%',type:'forex',otc:true},{name:'Gold XAU/USD',price:2345,change:'+0.8%',type:'otc',otc:true},{name:'US30 OTC',price:38750,change:'-0.5%',type:'otc',otc:true}];
function showPage(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('p-'+p).classList.add('active');if(p==='trade')draw();}
function filterAssets(t){curFilter=t;document.querySelectorAll('[id^=f-]').forEach(b=>b.classList.remove('filter-active'));document.getElementById('f-'+t).classList.add('filter-active');renderAssets();}
function renderAssets(){let list=assets;if(curFilter==='crypto')list=assets.filter(a=>a.type==='crypto');if(curFilter==='forex')list=assets.filter(a=>a.type==='forex');if(curFilter==='otc')list=assets.filter(a=>a.otc===true);let h='';list.forEach((a)=>{let idx=assets.indexOf(a);h+=`<div onclick="openAsset(${idx})" class="bg-zinc-900 p-3 rounded-xl flex justify-between items-center"><div><p class="font-black">${a.name}</p><p class="text-xs text-gray-400">${a.type} • ${a.otc?'OTC':''} • 87%</p></div><div class="text-right"><p class="font-black">${a.price}</p><p class="text-xs ${a.change.includes('+')?'text-green-400':'text-red-400'}">${a.change}</p></div></div>`});document.getElementById('assets').innerHTML=h;}
function openAsset(i){curAsset=assets[i];document.getElementById('tName').innerText=curAsset.name+' • '+(curAsset.otc?'OTC':'LIVE');points=[];for(let k=0;k<50;k++)points.push(curAsset.price*(1+(Math.random()-0.5)*0.02));showPage('trade');}
function updateBal(){['bal','bal2','bal3'].forEach(id=>{let el=document.getElementById(id);if(el)el.innerText='R'+balance.toFixed(2)});localStorage.setItem('dt_bal',balance);}
updateBal();renderAssets();
let points=[];for(let i=0;i<50;i++)points.push(curAsset.price);let price=curAsset.price;const c=document.getElementById('chart'),ctx=c.getContext('2d');
function draw(){ctx.fillStyle='#18181b';ctx.fillRect(0,0,c.width,c.height);ctx.beginPath();ctx.strokeStyle='#eab308';ctx.lineWidth=2.5;let min=Math.min(...points),max=Math.max(...points),range=(max-min)||1;points.forEach((p,i)=>{let x=(i/49)*c.width;let y=c.height-((p-min)/range)*(c.height-20)-10;if(i==0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();}
setInterval(()=>{price*=(1+(Math.random()-0.5)*0.002);points.push(price);points.shift();document.getElementById('price').innerText=curAsset.name+' '+price.toFixed(curAsset.price>100?2:5);draw();},70);
function trade(type){let stake=parseFloat(document.getElementById('tAmt').value);if(stake>balance)return alert('Low balance - Add Deposit');let r=document.getElementById('result');r.classList.remove('hidden');r.className='mt-3 p-3 rounded-xl text-center font-black bg-yellow-500 text-black';r.innerText=type+' '+curAsset.name+' R'+stake+'...5s';setTimeout(()=>{let win=Math.random()>0.4;if(win){let pr=stake*0.87;balance+=pr;r.className='mt-3 p-3 rounded-xl text-center font-black bg-green-500 text-black';r.innerText='✅ WIN +R'+pr.toFixed(2);document.getElementById('hist').innerHTML=`<div class="bg-zinc-900 p-3 rounded-xl flex justify-between"><span>${curAsset.name} ${type} R${stake}</span><span class="text-green-400">+R${pr.toFixed(2)}</span></div>`+document.getElementById('hist').innerHTML;}else{balance-=stake;r.className='mt-3 p-3 rounded-xl text-center font-black bg-red-500 text-white';r.innerText='❌ LOSS -R'+stake;document.getElementById('hist').innerHTML=`<div class="bg-zinc-900 p-3 rounded-xl flex justify-between"><span>${curAsset.name} ${type} R${stake}</span><span class="text-red-400">-R${stake}</span></div>`+document.getElementById('hist').innerHTML;}updateBal()},5000);}
function doDeposit(){let a=parseFloat(document.getElementById('amt').value);balance+=a;updateBal();alert('R'+a+' added!');showPage('markets');}
draw();
</script></body></html>
